name: Android APK (Türkçe altyazı)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sistem bağımlılıkları (protoc)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Python bağımlılıkları (nanopb)
        run: pip install protobuf grpcio-tools

      - name: Android NDK ve CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # oboe alt modülündeki örnek projelerin wrapper'ı doğrulamaya takılıyor
          validate-wrappers: false

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: chiaki-ceviri-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: TV'ye kolay indirme için sürüm (release) olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/*.apk chiaki-ceviri.apk
          gh release delete ceviri-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ceviri-latest chiaki-ceviri.apk \
            --target "${{ github.sha }}" \
            --title "Chiaki Çeviri (Türkçe altyazı) - son sürüm" \
            --notes "Commit: ${{ github.sha }}" --prerelease
